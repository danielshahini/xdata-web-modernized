#name of the database to be used; created by the default postgresql script, change if you 
# want to create your own database name
databaseName=xdata

#database user name- 
existingDatabaseUser=testing1
#password
existingDatabaseUserPasswd=testing1


# Address of database server; update this if your database is not listening on localhost port 5432
databaseIP=localhost
databasePort=5432

#Path to SMT Solver; update it to the location where you will be installing the cvc3 executable
smtsolver=cvc3


#Scratch directory; for temporary files Leave these as /tmp preferably
homeDir=/tmp


#Deprecated - directory of scripts; created temporarily for application testing
scriptsDir=/tmp


#directory for xml files created temporariliy for application testing 
dataDir=/tmp


#Consumer Auth Key for LTI integration; needed only if you are integrating with a learning management
# system such as moodle, blackboard or webct

## To be moved to DB
consumerAuthKey=YourLTIConsumerAuthKey


#Secret key for LTI Integration
## To be moved to DB
secretKey=YourSecretKeyHere


#Call back URL of the LTI system to upload marks
callBackURL=


# Xdata URL expected for OAUTH authentication from LMS  
# Set URL of tool.jsp as accessible by LMS

XDataUrlFromLMS =  

logFile=/tmp/XData.log
logLevel=INFO
 

#Default password for admin login
adminPassword = admin

#Log files configuration
logFile=/home/shree/temp_cvc4/XData.log
logLevel=ALL


# Database connection
spring.datasource.url=jdbc:postgresql://${XDATA_DB_HOST:localhost}:${XDATA_DB_PORT:5432}/${XDATA_DB_NAME:xdatadb}
spring.datasource.username=${XDATA_DB_USER:postgres}
spring.datasource.password=${XDATA_DB_PASS:1709}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# XData Spezifische Pfade
xdata.smtsolver=${XDATA_SMTSOLVER:/usr/bin/z3}
xdata.smtargs=-smt2

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# Legacy Bridge Properties
xdata.databaseIP=${XDATA_DB_HOST:localhost}
xdata.databasePort=${XDATA_DB_PORT:5432}
xdata.databaseName=${XDATA_DB_NAME:xdatadb}
xdata.databaseUsername=${XDATA_DB_USER:postgres}
xdata.databasePassword=${XDATA_DB_PASS:1709}

# Test Database (für die Generierung)
xdata.test.db.user=${XDATA_TEST_DB_USER:testuser}
xdata.test.db.password=${XDATA_TEST_DB_PASS:Testuser@123}

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# CORS Settings
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost}

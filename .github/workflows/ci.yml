name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 · Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xdata-web/backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # JDK 21 — Lombok 1.18.32 does not support newer JDKs; the project targets source 17.
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  frontend:
    name: Frontend (Node 18 · CRA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xdata-web/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 18
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: xdata-web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build
        run: npm run build
